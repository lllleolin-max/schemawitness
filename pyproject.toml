[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "schemawitness"
version = "0.1.1"
description = "Directional JSON Schema inclusion evidence with independently checked wire counterexamples"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
schemawitness = "schemawitness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
